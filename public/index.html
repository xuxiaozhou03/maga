<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ETF 总览 · ETF Quant Lab</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  </head>
  <body>
    <header class="app-header">
      <div class="header-inner">
        <a class="brand" href="index.html">
          <span class="brand-mark">QF</span>
          <span class="brand-copy">
            <strong>ETF Quant Lab</strong>
            <span>A 股 ETF 策略研究与回测</span>
          </span>
        </a>
        <div class="nav-actions">
          <a class="btn" href="#run-history">
            <i data-lucide="history"></i>回测历史
          </a>
          <button class="btn" id="syncBtn" type="button">
            <i data-lucide="refresh-cw"></i>同步数据
          </button>
          <a class="btn btn-primary" href="create.html">
            <i data-lucide="plus"></i>新建回测
          </a>
        </div>
      </div>
    </header>

    <main class="page-shell">
      <section class="page-intro">
        <div>
          <p class="eyebrow">ETF Universe</p>
          <h1>ETF 总览</h1>
          <p class="subtitle">
            浏览 ETF 池的规模、行情与近期表现，并结合动量、波动、估值等特征排名筛选标的。
          </p>
        </div>
        <div class="run-meta" id="dataStamp">正在读取 ETF 数据</div>
      </section>

      <section class="summary-strip" aria-label="ETF 概览">
        <div class="summary-item">
          <span>ETF 数量</span>
          <strong id="totalCount">-</strong>
        </div>
        <div class="summary-item">
          <span>总规模</span>
          <strong id="totalScale">-</strong>
        </div>
        <div class="summary-item">
          <span>上涨 / 下跌</span>
          <strong id="upDown">-</strong>
        </div>
        <div class="summary-item">
          <span>最新交易日</span>
          <strong id="asOfDate">-</strong>
        </div>
      </section>

      <section class="section" id="etf-list">
        <div class="section-head">
          <div>
            <p class="eyebrow">Universe</p>
            <h2>ETF 列表</h2>
          </div>
          <span class="muted" id="resultMeta">正在载入</span>
        </div>
        <div id="etfTable">
          <div class="empty"><strong>正在载入 ETF 列表</strong></div>
        </div>
      </section>

      <section class="section" id="run-history">
        <div class="section-head">
          <div>
            <p class="eyebrow">Runs</p>
            <h2>回测历史</h2>
          </div>
          <span class="muted" id="runMeta">正在载入回测记录</span>
        </div>
        <div id="runList">
          <div class="empty"><strong>正在载入回测记录</strong></div>
        </div>
      </section>
    </main>

    <script src="app.js?v=20261114-2"></script>
    <script>
      let strategyNames = {};
      let overview = null;
      let featureState = {
        date: null,
        rows: [],
        byCode: new Map(),
        loading: false,
        error: null,
      };
      let sortState = { key: "rank_ret_1m", direction: "desc" };

      const ETF_COLUMNS = [
        { key: "code", label: "代码", type: "code" },
        { key: "name", label: "名称", type: "name" },
        { key: "trackingIndex", label: "跟踪指数", type: "text" },
        { key: "scale", label: "规模", type: "scale" },
        { key: "latestClose", label: "最新价", type: "price" },
        { key: "latestChangePercent", label: "涨跌幅", type: "change" },
        { key: "latestAmount", label: "成交额", type: "compact" },
        { key: "ret20", label: "20 日", type: "pct" },
        { key: "ret60", label: "60 日", type: "pct" },
        { key: "premiumRate", label: "溢价率", type: "premium" },
      ];
      const FEATURE_COLUMNS = [
        { key: "rank_ret_1m", label: "动量排名", type: "feature", format: "percent" },
        { key: "rank_vol_20d", label: "低波排名", type: "feature", format: "percent" },
        { key: "rank_val_percent", label: "低估排名", type: "feature", format: "percent" },
        { key: "ret_1w", label: "一周动量", type: "feature", format: "percent" },
        { key: "ret_1m", label: "一月动量", type: "feature", format: "percent" },
        { key: "ret_3m", label: "三月动量", type: "feature", format: "percent" },
        { key: "vol_20d", label: "20 日波动", type: "feature", format: "percent" },
        { key: "max_dd_60d", label: "60 日回撤", type: "feature", format: "percent" },
        { key: "ma_dev_20d", label: "均线偏离", type: "feature", format: "percent" },
        { key: "turnover_20d", label: "20 日成交额", type: "feature", format: "compact" },
        { key: "val_percent", label: "估值分位", type: "feature", format: "percent" },
      ];
      const COLUMNS = [...ETF_COLUMNS, ...FEATURE_COLUMNS];
      const TEXT_SORT_KEYS = new Set(["code", "name", "trackingIndex"]);

      const numberOr = (value, fallback) =>
        value == null || !Number.isFinite(Number(value)) ? fallback : Number(value);

      const scaleText = (value) =>
        value == null ? "-" : `${(Number(value) / 1e8).toFixed(1)} 亿`;

      const premiumText = (value) =>
        value == null || !Number.isFinite(Number(value))
          ? "-"
          : `${Number(value).toFixed(2)}%`;

      const featureValueText = (value, format) => {
        if (value == null || !Number.isFinite(Number(value))) return "-";
        return format === "compact"
          ? fmtCompact(value, "元")
          : fmtPct(value);
      };

      function mergedRows() {
        return (overview?.rows ?? []).map((row) => {
          const features = featureState.byCode.get(row.code) ?? {};
          return { ...row, features };
        });
      }

      function columnValue(row, column) {
        return column.type === "feature"
          ? row.features[column.key]
          : row[column.key];
      }

      function sortedRows() {
        const { key, direction } = sortState;
        const column = COLUMNS.find((item) => item.key === key) || ETF_COLUMNS[3];
        const factor = direction === "asc" ? 1 : -1;
        return mergedRows().sort((left, right) => {
          const a = columnValue(left, column);
          const b = columnValue(right, column);
          if (a == null && b == null) return 0;
          if (a == null) return 1;
          if (b == null) return -1;
          if (column.type === "text" || TEXT_SORT_KEYS.has(column.key)) {
            return String(a).localeCompare(String(b), "zh-CN") * factor;
          }
          return (Number(a) - Number(b)) * factor;
        });
      }

      function renderSummary() {
        if (!overview) return;
        const { summary, asOf } = overview;
        document.getElementById("totalCount").textContent = summary.count;
        document.getElementById("totalScale").textContent = scaleText(summary.totalScale);
        document.getElementById("upDown").innerHTML =
          `<span class="positive">${summary.up}</span><span class="muted"> / </span><span class="negative">${summary.down}</span>`;
        document.getElementById("asOfDate").textContent = fmtDate(asOf);
        document.getElementById("dataStamp").textContent =
          `${summary.priced} 只有最新行情 · 当日成交额 ${fmtCompact(summary.totalAmount, "元")}`;
      }

      function cellHtml(row, column) {
        const href = `etf.html?code=${encodeURIComponent(row.code)}&limit=260`;
        switch (column.type) {
          case "code":
            return `<a class="mono" href="${href}">${escapeHtml(row.code)}</a>`;
          case "name":
            return `<a href="${href}">${escapeHtml(row.name)}</a>`;
          case "scale":
            return scaleText(row.scale);
          case "price":
            return fmtNum(row.latestClose, 3);
          case "change": {
            const value = numberOr(row.latestChangePercent, 0) / 100;
            return `<span class="${colorClass(value)}">${fmtPct(value)}</span>`;
          }
          case "compact":
            return fmtCompact(row.latestAmount, "元");
          case "pct":
            return `<span class="${colorClass(row[column.key])}">${fmtPct(row[column.key])}</span>`;
          case "premium":
            return premiumText(row.premiumRate);
          case "feature":
            return featureValueText(row.features[column.key], column.format);
          default:
            return escapeHtml(row[column.key] || "-");
        }
      }

      function headerHtml(column) {
        const active = sortState.key === column.key;
        const indicator = active ? (sortState.direction === "asc" ? "↑" : "↓") : "↕";
        const ariaSort = active
          ? ` aria-sort="${sortState.direction === "asc" ? "ascending" : "descending"}"`
          : "";
        return `<th${ariaSort}><button class="table-sort ${active ? "is-active" : ""}" type="button" data-sort="${column.key}">${escapeHtml(column.label)}<span class="sort-indicator">${indicator}</span></button></th>`;
      }

      function renderTable() {
        if (!overview) return;
        const rows = sortedRows();
        const element = document.getElementById("etfTable");
        document.getElementById("resultMeta").textContent =
          `${overview.rows.length} 只 ETF · ${FEATURE_COLUMNS.length} 项特征${featureState.loading ? " · 特征载入中" : featureState.error ? " · 特征加载失败" : ""} · 点击表头排序 · 左右滑动查看全部特征`;

        if (!rows.length) {
          element.innerHTML = emptyState("暂无 ETF 数据");
          return;
        }
        element.innerHTML = [
          '<div class="table-wrap"><table><thead><tr class="table-group-row">',
          `<th colspan="${ETF_COLUMNS.length}">ETF 行情</th>`,
          `<th colspan="${FEATURE_COLUMNS.length}">特征</th>`,
          "</tr><tr>",
          COLUMNS.map(headerHtml).join(""),
          "</tr></thead><tbody>",
          rows
            .map(
              (row) =>
                `<tr>${COLUMNS.map((column) => `<td>${cellHtml(row, column)}</td>`).join("")}</tr>`,
            )
            .join(""),
          "</tbody></table></div>",
        ].join("");
      }

      function render() {
        renderSummary();
        renderTable();
        refreshIcons();
      }

      async function loadOverview() {
        try {
          overview = await api("/etfs/overview");
          render();
        } catch (error) {
          document.getElementById("etfTable").innerHTML = emptyState(
            "ETF 列表加载失败",
            error.message,
          );
          document.getElementById("dataStamp").textContent = "数据读取失败";
          toast(`ETF 列表加载失败：${error.message}`, "error");
        }
      }

      async function loadFeatures() {
        featureState = { ...featureState, loading: true, error: null };
        renderTable();
        try {
          const response = await api("/features/snapshot");
          featureState = {
            date: response.date,
            rows: response.rows,
            byCode: new Map(response.rows.map((row) => [row.code, row])),
            loading: false,
            error: null,
          };
          renderTable();
        } catch (error) {
          featureState = {
            date: null,
            rows: [],
            byCode: new Map(),
            loading: false,
            error: error.message,
          };
          renderTable();
          toast(`特征数据加载失败：${error.message}`, "error");
        }
      }

      async function loadRuns() {
        const element = document.getElementById("runList");
        try {
          const [{ rows }, strategies] = await Promise.all([
            api("/backtests?limit=100"),
            api("/strategies"),
          ]);
          strategyNames = Object.fromEntries(
            strategies.map((strategy) => [strategy.key, strategy.name]),
          );
          const successful = rows.filter((row) => row.status === "success");
          document.getElementById("runMeta").textContent = rows.length
            ? `${rows.length} 次运行 · ${successful.length} 次完成 · 最近 ${fmtDateTime(rows[0].createdAt)}`
            : "暂无运行记录";

          table(
            element,
            ["创建时间", "策略", "标的", "区间", "状态", "总收益", "年化", "最大回撤", "夏普", "成交", ""],
            rows.map((row) => [
              escapeHtml(fmtDateTime(row.createdAt)),
              escapeHtml(strategyNames[row.strategyKey] || row.strategyKey),
              `<span class="mono">${parseCodes(row.codes).map(escapeHtml).join(", ") || "-"}</span>`,
              `${fmtDate(row.startDate)} 至 ${fmtDate(row.endDate)}`,
              statusPill(row.status),
              `<span class="${colorClass(row.totalReturn)}">${fmtPct(row.totalReturn)}</span>`,
              `<span class="${colorClass(row.annualReturn)}">${fmtPct(row.annualReturn)}</span>`,
              `<span class="negative">${fmtPct(row.maxDrawdown)}</span>`,
              fmtNum(row.sharpe, 2),
              row.tradeCount ?? "-",
              `<a href="detail.html?id=${encodeURIComponent(row.id)}">查看</a>`,
            ]),
            "暂无回测记录",
          );
        } catch (error) {
          element.innerHTML = emptyState("回测记录加载失败", error.message);
          document.getElementById("runMeta").textContent = "回测记录读取失败";
        }
      }

      document.getElementById("etfTable").addEventListener("click", (event) => {
        const button = event.target.closest("[data-sort]");
        if (!button) return;
        const key = button.dataset.sort;
        if (sortState.key === key) {
          sortState = {
            key,
            direction: sortState.direction === "asc" ? "desc" : "asc",
          };
        } else {
          sortState = {
            key,
            direction: TEXT_SORT_KEYS.has(key) ? "asc" : "desc",
          };
        }
        renderTable();
      });

      document.getElementById("syncBtn").addEventListener("click", async (event) => {
        const button = event.currentTarget;
        setBusy(button, true, "同步中");
        try {
          await api("/sync", { method: "POST", body: "{}" });
          toast("数据同步完成", "success");
          await Promise.all([loadOverview(), loadFeatures(), loadRuns()]);
        } catch (error) {
          toast(`同步失败：${error.message}`, "error");
        } finally {
          setBusy(button, false);
        }
      });

      Promise.all([loadOverview(), loadFeatures(), loadRuns()]).finally(refreshIcons);
    </script>
  </body>
</html>
